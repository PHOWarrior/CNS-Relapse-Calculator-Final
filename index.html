<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS Relapse Risk Calculator</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 0 15px; 
        }
        .container { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        h2 { 
            color: #1a365d; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 6px; 
            font-size: 24px;
        }
        p.subtitle { 
            text-align: center; 
            color: #64748b; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 14px; 
            font-weight: 500;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            color: #334155; 
            font-size: 14px;
        }
        select { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            font-size: 15px; 
            background-color: #f8fafc; 
            color: #0f172a;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        select:focus {
            border-color: #2563eb;
            background-color: #fff;
        }
        button { 
            width: 100%; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: 700; 
            border-radius: 6px; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background-color 0.2s, transform 0.1s; 
        }
        button:hover { 
            background-color: #1d4ed8; 
        }
        button:active {
            transform: scale(0.99);
        }
        #result-box { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 8px; 
            text-align: center; 
            display: none; 
            box-sizing: border-box;
        }
        .score { 
            font-size: 22px; 
            font-weight: 700; 
            margin-bottom: 12px; 
            color: #0f172a;
        }
        .risk-tier { 
            font-size: 18px; 
            font-weight: 700; 
            padding: 8px 16px; 
            border-radius: 20px; 
            display: inline-block; 
            margin-bottom: 8px;
        }
        .rate { 
            font-size: 15px; 
            color: #475569; 
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>CNS Relapse Risk Score</h2>
    <p class="subtitle">Pediatric Acute Lymphoblastic Leukemia</p>

    <div class="form-group">
        <label for="cns">Initial CNS Status</label>
        <select id="cns">
            <option value="0">CNS 1 (0 pts)</option>
            <option value="2">CNS 2 (+2 pts)</option>
            <option value="2">CNS 3 (+2 pts)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="tlc">Total Leukocyte Count (TLC)</label>
        <select id="tlc">
            <option value="0">&lt; 50,000 / &mu;L (0 pts)</option>
            <option value="2">&ge; 50,000 / &mu;L (+2 pts)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="age">Age at Diagnosis</label>
        <select id="age">
            <option value="0">&ge; 5 Years Old (0 pts)</option>
            <option value="1">&lt; 5 Years Old (+1 pt)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="maint">Maintenance Phase Interruption</label>
        <select id="maint">
            <option value="0">&le; 14 Days (0 pts)</option>
            <option value="2">&gt; 14 Days (+2 pts)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="preMaint">Pre-Maintenance Chemo Interruption</label>
        <select id="preMaint">
            <option value="0">No (0 pts)</option>
            <option value="1">Yes (+1 pt)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="lasp">L-Asparaginase Interruption</label>
        <select id="lasp">
            <option value="0">No (0 pts)</option>
            <option value="1">Yes (+1 pt)</option>
        </select>
    </div>

    <button type="button" onclick="calculateRisk()">Calculate Risk Score</button>

    <div id="result-box">
        <div class="score">Total Score: <span id="score-val">0</span></div>
        <div class="risk-tier" id="tier-val">Low Risk</div>
        <div class="rate" id="rate-val">Estimated Relapse Rate: ~2.7%</div>
    </div>
</div>

<script>
    function calculateRisk() {
        let score = 0;
        score += parseInt(document.getElementById('cns').value);
        score += parseInt(document.getElementById('tlc').value);
        score += parseInt(document.getElementById('age').value);
        score += parseInt(document.getElementById('maint').value);
        score += parseInt(document.getElementById('preMaint').value);
        score += parseInt(document.getElementById('lasp').value);

        let tier = "";
        let rate = "";
        let bgColor = "";
        let color = "#ffffff";

        if (score <= 1) {
            tier = "Low Risk"; 
            rate = "Estimated Relapse Rate: ~2.7%"; 
            bgColor = "#16a34a"; // Green
        } else if (score === 2) {
            tier = "Intermediate Risk"; 
            rate = "Estimated Relapse Rate: ~13.6%"; 
            bgColor = "#eab308"; 
            color = "#0f172a"; // Dark text for yellow
        } else if (score <= 4) {
            tier = "High Risk"; 
            rate = "Estimated Relapse Rate: ~34.9%"; 
            bgColor = "#ea580c"; // Orange
        } else {
            tier = "Very High Risk"; 
            rate = "Estimated Relapse Rate: ~76.7%"; 
            bgColor = "#dc2626"; // Red
        }

        document.getElementById('score-val').innerText = score;
        document.getElementById('tier-val').innerText = tier;
        document.getElementById('tier-val').style.backgroundColor = bgColor;
        document.getElementById('tier-val').style.color = color;
        document.getElementById('rate-val').innerText = rate;
        
        let resultBox = document.getElementById('result-box');
        resultBox.style.display = "block";
        resultBox.style.backgroundColor = "#f8fafc";
        resultBox.style.border = "2px solid " + bgColor;
    }
</script>
</body>
</html>
